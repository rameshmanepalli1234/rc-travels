[build]
  command = "yarn build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Static assets must not be rewritten to index.html
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.ico"
  status = 200
  force = true

[[redirects]]
  from = "/favicon.svg"
  to = "/favicon.svg"
  status = 200
  force = true

[[redirects]]
  from = "/manifest.json"
  to = "/manifest.json"
  status = 200
  force = true

# API must not fall through to SPA index.html
[[redirects]]
  from = "/api/travel-assistant/*"
  to = "/.netlify/functions/travel-assistant-:splat"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
