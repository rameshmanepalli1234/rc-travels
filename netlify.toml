[build]
  command = "yarn build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["server/**"]

# Static assets must not be rewritten to index.html
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.ico"
  status = 200
  force = true

[[redirects]]
  from = "/favicon.svg"
  to = "/favicon.svg"
  status = 200
  force = true

[[redirects]]
  from = "/manifest.json"
  to = "/manifest.json"
  status = 200
  force = true

# Travel Assistant API → Netlify Functions (legacy function URLs)
[[redirects]]
  from = "/api/travel-assistant/health"
  to = "/.netlify/functions/travel-assistant-health"
  status = 200

[[redirects]]
  from = "/api/travel-assistant/chat"
  to = "/.netlify/functions/travel-assistant-chat"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
